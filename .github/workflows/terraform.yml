name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - "lambda/**"
      - "frontend/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "lambda/**"
      - "frontend/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write # for OIDC
  contents: read
  pull-requests: write # to comment the plan on PRs

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::794692801848:role/zetrax-github-actions
          aws-region: ap-southeast-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - run: terraform fmt -check -recursive

      - run: terraform init

      - run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const output = execSync("terraform show -no-color tfplan", { cwd: "terraform" }).toString();
            const body = [
              "### Terraform Plan",
              "",
              "<details><summary>Show plan</summary>",
              "",
              "```terraform",
              output.length > 60000 ? output.slice(0, 60000) + "\n…truncated…" : output,
              "```",
              "",
              "</details>",
            ].join("\n");
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan errored
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
