<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- Pokeball symbol -->
    <symbol id="pokeball" viewBox="-50 -50 100 100">
      <circle cx="0" cy="0" r="40" fill="none" stroke="white" stroke-width="4"/>
      <line x1="-40" y1="0" x2="40" y2="0" stroke="white" stroke-width="4"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="4"/>
      <circle cx="0" cy="0" r="4" fill="white"/>
    </symbol>
    <!-- Pikachu head silhouette (round face + big pointy ears + cheeks) -->
    <symbol id="pika" viewBox="-60 -70 120 130">
      <!-- Left ear -->
      <path d="M -45 -30 L -55 -65 L -25 -45 Z" fill="white"/>
      <path d="M -48 -55 L -52 -62 L -42 -58 Z" fill="black" opacity="0.5"/>
      <!-- Right ear -->
      <path d="M 45 -30 L 55 -65 L 25 -45 Z" fill="white"/>
      <path d="M 48 -55 L 52 -62 L 42 -58 Z" fill="black" opacity="0.5"/>
      <!-- Head (round) -->
      <circle cx="0" cy="0" r="40" fill="white"/>
      <!-- Cheeks -->
      <circle cx="-28" cy="12" r="7" fill="black" opacity="0.35"/>
      <circle cx="28" cy="12" r="7" fill="black" opacity="0.35"/>
      <!-- Eyes -->
      <circle cx="-14" cy="-5" r="4" fill="black" opacity="0.55"/>
      <circle cx="14" cy="-5" r="4" fill="black" opacity="0.55"/>
      <!-- Nose dot -->
      <circle cx="0" cy="6" r="2" fill="black" opacity="0.6"/>
    </symbol>
    <!-- Lightning bolt -->
    <symbol id="bolt" viewBox="-30 -50 60 100">
      <path d="M -5 -45 L 15 -5 L 2 -2 L 20 45 L -10 5 L 5 2 Z" fill="white"/>
    </symbol>
    <!-- 4-point sparkle -->
    <symbol id="sparkle" viewBox="-10 -10 20 20">
      <path d="M 0 -9 L 2 -2 L 9 0 L 2 2 L 0 9 L -2 2 L -9 0 L -2 -2 Z" fill="white"/>
    </symbol>
    <!-- Starter silhouette (Bulbasaur-ish — round body with bulb) -->
    <symbol id="starter" viewBox="-50 -40 100 80">
      <ellipse cx="0" cy="10" rx="35" ry="25" fill="white"/>
      <circle cx="0" cy="-18" r="18" fill="white"/>
      <!-- Bulb on back -->
      <ellipse cx="-5" cy="-25" rx="12" ry="10" fill="black" opacity="0.3"/>
      <!-- Legs -->
      <ellipse cx="-20" cy="30" rx="6" ry="4" fill="white"/>
      <ellipse cx="20" cy="30" rx="6" ry="4" fill="white"/>
    </symbol>
  </defs>

  <!-- Scattered BIG elements -->
  <g opacity="0.07">
    <use href="#pokeball" x="80" y="90" width="80" height="80"/>
    <use href="#pokeball" x="360" y="200" width="100" height="100" transform="rotate(35 410 250)"/>
    <use href="#pokeball" x="200" y="380" width="70" height="70" transform="rotate(-20 235 415)"/>
  </g>

  <!-- Pikachu silhouettes -->
  <g opacity="0.08">
    <use href="#pika" x="250" y="60" width="90" height="100"/>
    <use href="#pika" x="40" y="300" width="75" height="85" transform="rotate(-12 77 342)"/>
  </g>

  <!-- Starter silhouette -->
  <g opacity="0.06">
    <use href="#starter" x="340" y="340" width="90" height="75"/>
  </g>

  <!-- Lightning bolts -->
  <g opacity="0.1">
    <use href="#bolt" x="150" y="190" width="35" height="60" transform="rotate(15 167 220)"/>
    <use href="#bolt" x="380" y="90" width="30" height="50" transform="rotate(-20 395 115)"/>
    <use href="#bolt" x="60" y="430" width="25" height="45"/>
  </g>

  <!-- Sparkles scattered -->
  <g opacity="0.22">
    <use href="#sparkle" x="20" y="20" width="14" height="14"/>
    <use href="#sparkle" x="440" y="40" width="10" height="10"/>
    <use href="#sparkle" x="300" y="170" width="12" height="12"/>
    <use href="#sparkle" x="180" y="110" width="8" height="8"/>
    <use href="#sparkle" x="130" y="260" width="10" height="10"/>
    <use href="#sparkle" x="420" y="300" width="14" height="14"/>
    <use href="#sparkle" x="60" y="200" width="8" height="8"/>
    <use href="#sparkle" x="280" y="430" width="12" height="12"/>
    <use href="#sparkle" x="400" y="440" width="9" height="9"/>
    <use href="#sparkle" x="220" y="240" width="7" height="7"/>
    <use href="#sparkle" x="100" y="400" width="9" height="9"/>
    <use href="#sparkle" x="350" y="20" width="7" height="7"/>
  </g>
</svg>
