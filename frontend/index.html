<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zetrax Collects</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a0f;
      color: white;
      font-family: "Inter", sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.15), transparent 40%),
        radial-gradient(circle at 50% 100%, rgba(255, 220, 0, 0.1), transparent 50%);
      z-index: 0;
      pointer-events: none;
      animation: shimmer 12s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 550px;
      margin: 0 auto;
    }
    .banner {
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(0, 200, 255, 0.35), 0 20px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: block;
    }
    .tagline {
      color: #a0a0b8;
      font-size: 0.95rem;
      margin: 0 0 30px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pack-btn {
      display: block;
      margin: 0 auto 20px;
      padding: 22px 44px;
      background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ff006e);
      background-size: 200% auto;
      color: white;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(131, 56, 236, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: shine-btn 4s linear infinite;
    }
    @keyframes shine-btn { to { background-position: 200% center; } }
    .pack-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(131, 56, 236, 0.7);
    }
    .pack-btn:disabled { opacity: 0.6; cursor: wait; }

    #pack-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 40px;
    }
    .card {
      padding: 14px 8px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: reveal 0.5s ease forwards;
    }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.3s; }
    .card:nth-child(3) { animation-delay: 0.5s; }
    .card:nth-child(4) { animation-delay: 0.7s; }
    .card:nth-child(5) { animation-delay: 0.9s; }
    .card .name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .card .type { font-size: 0.7rem; color: #a0a0b8; margin-bottom: 6px; }
    .card .hp { font-size: 0.8rem; color: #ff6b6b; margin-bottom: 8px; }
    .card .rarity {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      font-weight: 700;
    }
    .card.common .rarity { background: #6b7280; }
    .card.uncommon { border-color: rgba(6, 255, 165, 0.4); box-shadow: 0 0 16px rgba(6, 255, 165, 0.15); }
    .card.uncommon .rarity { background: #06ffa5; color: #0a0a0f; }
    .card.rare { border-color: rgba(58, 134, 255, 0.5); box-shadow: 0 0 20px rgba(58, 134, 255, 0.3); }
    .card.rare .rarity { background: #3a86ff; }
    .card.ultra { border-color: rgba(131, 56, 236, 0.7); box-shadow: 0 0 28px rgba(131, 56, 236, 0.5); }
    .card.ultra .rarity { background: linear-gradient(90deg, #ff006e, #8338ec); }
    .card.secret {
      background: linear-gradient(#1a1a2e, #1a1a2e) padding-box,
                  linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b) border-box;
      border: 2px solid transparent;
      box-shadow: 0 0 36px rgba(255, 190, 11, 0.5);
    }
    .card.secret .rarity { background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b); }
    .card.chase {
      background: linear-gradient(#1a1a2e, #1a1a2e) padding-box,
                  linear-gradient(90deg, #ffd700, #ff6b00, #ffd700) border-box;
      border: 3px solid transparent;
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.7);
      animation: chase-glow 2s ease-in-out infinite, reveal 0.5s ease forwards;
    }
    @keyframes chase-glow {
      0%, 100% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.7); }
      50%     { box-shadow: 0 0 90px rgba(255, 215, 0, 1); }
    }
    .card.chase .rarity { background: linear-gradient(90deg, #ffd700, #ff6b00); color: #0a0a0f; }

    /* Recent Pulls */
    .section-title {
      font-size: 0.85rem;
      color: #a0a0b8;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 40px 0 16px 0;
      font-weight: 600;
    }
    #recent-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 40px;
    }
    .recent-pack {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 0.78rem;
      text-align: left;
    }
    .recent-pack .badge {
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      white-space: nowrap;
    }
    .recent-pack .cards-list {
      flex: 1;
      color: #c5c5d6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .recent-pack .time {
      color: #6a6a80;
      font-size: 0.72rem;
      white-space: nowrap;
    }
    .badge.common { background: #6b7280; }
    .badge.uncommon { background: #06ffa5; color: #0a0a0f; }
    .badge.rare { background: #3a86ff; }
    .badge.ultra { background: linear-gradient(90deg, #ff006e, #8338ec); }
    .badge.secret { background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b); }
    .badge.chase { background: linear-gradient(90deg, #ffd700, #ff6b00); color: #0a0a0f; }
    .empty-recent { color: #6a6a80; font-size: 0.85rem; padding: 20px; font-style: italic; }

    a.social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      background: #1a1a2e;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin: 14px auto;
      max-width: 340px;
      transition: all 0.2s ease;
    }
    a.social:hover { background: #2a2a4e; transform: translateY(-2px); }
    a.social svg { width: 24px; height: 24px; flex-shrink: 0; }
    a.social[href*="youtube"]:hover { box-shadow: 0 8px 24px rgba(255, 0, 0, 0.4); }
    a.social[href*="instagram"]:hover { box-shadow: 0 8px 24px rgba(228, 64, 95, 0.4); }
    a.social[href*="tiktok"]:hover { box-shadow: 0 8px 24px rgba(0, 242, 234, 0.4); }
  </style>
</head>
<body>
  <div class="container">
    <img class="banner" src="banner.jpg" alt="Zetrax Collects">
    <p class="tagline">Opening packs &middot; Chasing hits</p>

    <button id="pack-btn" class="pack-btn" onclick="openPack()">OPEN A PACK</button>
    <div id="pack-results"></div>

    <div class="section-title">Recent Pulls</div>
    <div id="recent-list">
      <div class="empty-recent">Loading recent pulls...</div>
    </div>

    <a class="social" href="https://youtube.com/@zetraxcollects" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#FF0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      Watch on YouTube
    </a>
    <a class="social" href="https://www.instagram.com/zetrax_collects" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#E4405F"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
      Follow on Instagram
    </a>
    <a class="social" href="https://www.tiktok.com/@zetraxcollects" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="#00F2EA"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.84-.1z"/></svg>
      Watch on TikTok
    </a>
  </div>

  <script>
    const API_URL = "https://ybyl5df5i1.execute-api.ap-southeast-1.amazonaws.com/";
    const RARITY_CLASS = {
      "Common": "common",
      "Uncommon": "uncommon",
      "Rare": "rare",
      "Ultra Rare": "ultra",
      "Secret Rare": "secret",
      "Chase": "chase"
    };

    // Load recent pulls on page load
    document.addEventListener("DOMContentLoaded", loadRecent);

    async function loadRecent() {
      try {
        const resp = await fetch(API_URL + "?history=1");
        const data = await resp.json();
        renderRecent(data.recent || []);
      } catch (e) {
        document.getElementById("recent-list").innerHTML = "<div class='empty-recent'>Could not load recent pulls.</div>";
      }
    }

    async function openPack() {
      const btn = document.getElementById("pack-btn");
      const results = document.getElementById("pack-results");
      btn.disabled = true;
      btn.textContent = "OPENING...";
      results.innerHTML = "";
      try {
        const resp = await fetch(API_URL);
        const data = await resp.json();
        renderPack(data.pack);
        renderRecent(data.recent || []);
      } catch (e) {
        results.innerHTML = "<p style='color:#ff6b6b'>Failed to open pack. Try again!</p>";
      } finally {
        btn.disabled = false;
        btn.textContent = "OPEN A PACK";
      }
    }

    function renderPack(cards) {
      const results = document.getElementById("pack-results");
      results.innerHTML = cards.map(card => `
        <div class="card ${RARITY_CLASS[card.rarity] || 'common'}">
          <div class="name">${card.name}</div>
          <div class="type">${card.type}</div>
          <div class="hp">${card.hp} HP</div>
          <span class="rarity">${card.rarity}</span>
        </div>
      `).join("");
    }

    function renderRecent(packs) {
      const list = document.getElementById("recent-list");
      if (!packs.length) {
        list.innerHTML = "<div class='empty-recent'>No packs opened yet. Be the first!</div>";
        return;
      }
      list.innerHTML = packs.map(pack => {
        const names = pack.cards.map(c => c.name).join(", ");
        const cls = RARITY_CLASS[pack.rarest] || "common";
        return `
          <div class="recent-pack">
            <span class="badge ${cls}">${pack.rarest}</span>
            <span class="cards-list">${names}</span>
            <span class="time">${timeAgo(pack.opened_at)}</span>
          </div>
        `;
      }).join("");
    }

    function timeAgo(iso) {
      const then = new Date(iso).getTime();
      const now = Date.now();
      const secs = Math.floor((now - then) / 1000);
      if (secs < 60) return secs + "s ago";
      const mins = Math.floor(secs / 60);
      if (mins < 60) return mins + "m ago";
      const hours = Math.floor(mins / 60);
      if (hours < 24) return hours + "h ago";
      const days = Math.floor(hours / 24);
      return days + "d ago";
    }
  </script>
</body>
</html>
